<style>
  :root{
    --paper:#efe9dc;
    --ink:#2b2723;
    --rule:#c9bfa8;
    --clay:#b4553a;
    --moss:#5c6b4f;
    --card:#f7f3ea;
  }
  *{box-sizing:border-box; text-align:left;}
  body{
    margin:0;
    font-family: 'Courier New', ui-monospace, monospace;
    background: var(--paper);
    color: var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:40px 16px;
  }
  .sheet{
    width:420px;
    max-width:100%;
    background: var(--card);
    border:1px solid var(--rule);
    box-shadow: 4px 4px 0 rgba(43,39,35,0.08);
    padding:22px 24px 18px;
  }
  @media (max-width: 480px){
    body{ padding:0; }
    .sheet{ border:none; box-shadow:none; padding:14px 14px 12px; min-height:100vh; }
    header h1{ font-size:16px; }
    .float-row{ flex-wrap:wrap; row-gap:6px; }
    .matrix-grid{ grid-template-columns:1fr; }
    input[type=text], input[type=date], input[type=number]{ font-size:16px; } /* keeps mobile browsers from auto-zooming on focus */
    #addTaskTriggerBtn{ font-size:13px; padding:6px 14px; }
    .modal-box{ padding:14px; }
    .toast{ left:16px; right:16px; transform:translateY(12px); width:auto; justify-content:space-between; }
    li{ flex-wrap:wrap; }
    #dueModal > div{ padding:14px; }
    .toast.show{ transform:translateY(0); }
  }
  @media (max-width: 340px){
    .sheet{ padding:10px 10px 10px; }
    header h1{ font-size:14px; }
    .count{ font-size:10.5px; }
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
    margin-bottom:14px;
  }
  h1{
    font-size:18px;
    letter-spacing:1px;
    text-transform:uppercase;
    margin:0;
  }
  .count{
    font-size:12px;
    color:var(--moss);
  }
  form{display:flex; gap:8px; margin-bottom:16px;}
  input[type=text]{
    flex:1;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--rule);
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
    padding:6px 2px;
    outline:none;
  }
  input[type=text]:focus{border-bottom-color:var(--clay);}
  button{
    font-family:inherit;
    cursor:pointer;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--card);
    padding:6px 12px;
    font-size:13px;
  }
  button.ghost{
    background:transparent;
    color:var(--ink);
  }
  ul{list-style:none; margin:0; padding:0;}
  li{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 0;
    border-bottom:1px dashed var(--rule);
    font-size:14px;
  }
  li .box{
    width:14px; height:14px;
    border:1px solid var(--ink);
    margin-top:2px;
    flex-shrink:0;
    cursor:pointer;
    position:relative;
  }

    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayKey(){ return toKey(new Date()); }
  function keyToDate(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
  function diffDays(aKey, bKey){
    const MS = 24*60*60*1000;
    return Math.round((keyToDate(aKey) - keyToDate(bKey)) / MS);
  }
  function niceLabel(k){
    const today = todayKey();
    const yestKey = toKey(new Date(Date.now() - 86400000));
    const pretty = keyToDate(k).toLocaleDateString(undefined, { month:'long', day:'numeric' });
    if(k === today) return { text: `Today · ${pretty}`, isToday:true };
    if(k === yestKey) return { text: `Yesterday · ${pretty}`, isToday:false };
    return { text: pretty, isToday:false };
  }
  // ---- inline text editing (used for task text and habit names) ----
  function makeEditBtn(onClick){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'edit-text';
    b.title = 'edit text';
    b.textContent = '✎';
    b.onclick = onClick;
    return b;
  }
  // small clipboard-copy button, reused next to task/habit text
  function makeCopyBtn(getText){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'edit-text';
    b.title = 'copy text';
    b.textContent = '📋';
    b.onclick = (e) => {
      e.stopPropagation();
      const text = getText();
      const original = b.textContent;
      const onDone = ok => { b.textContent = ok ? '✓' : '✗'; setTimeout(() => { b.textContent = original; }, 900); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(() => onDone(true)).catch(() => fallbackCopy(text, onDone));
      } else {
        fallbackCopy(text, onDone);
      }
    };
    return b;
  }
  // renders text into a container, turning any http(s)/www URLs into real clickable
  // links (target=_blank), while leaving the rest as plain text. span.textContent
  // still reads back the full original string, so inline-editing keeps working.
  const URL_RE = /((?:https?:\/\/|www\.)[^\s<]+[^\s<.,;:!?'")\]])/gi;
  function renderLinkedText(container, text){
    container.textContent = '';
    let lastIndex = 0;
    text.replace(URL_RE, (match, _g, offset) => {
      if(offset > lastIndex) container.appendChild(document.createTextNode(text.slice(lastIndex, offset)));
      const a = document.createElement('a');
      a.href = /^https?:\/\//i.test(match) ? match : 'https://' + match;
      a.textContent = match;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'task-link';
      a.addEventListener('click', e => e.stopPropagation());
      container.appendChild(a);
      lastIndex = offset + match.length;
      return match;
    });
    if(lastIndex < text.length) container.appendChild(document.createTextNode(text.slice(lastIndex)));
  }
  function startInlineEdit(span, onSave){
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'text-edit-input';
    input.value = span.textContent;
    span.replaceWith(input);
    input.focus();
    input.select();
    let done = false;
    function commit(){
      if(done) return;
      done = true;
      const val = input.value.trim();
      if(val) onSave(val);
      save(); render();
    }
    input.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); commit(); }
      else if(e.key === 'Escape'){ done = true; render(); }
    });
    input.addEventListener('blur', commit);
  }

  function newId(){
    return (crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  }
  function weekdayOf(dateKey){ return keyToDate(dateKey).getDay(); } // 0=Sun .. 6=Sat
  // completions[k] is a 0-4 intensity level (github-style darkness). Older data
  // stored a plain boolean `true` for "done" — treat that as the max level (4).
  function levelOf(habit, dateKey){
    const v = habit.completions[dateKey];
    if(v === true) return 4;
    if(typeof v === 'number') return v;
    return 0;
  }
  // Pure recurrence-pattern check (ignores created/today bounds), so it can be
  // reused for calendar rendering, streaks, and reports alike.
  // Supports two recurrence styles, stored on h.repeat:
  //   { mode:'weekdays', days:[0-6] }                  — repeats on given weekdays (old default)
  //   { mode:'interval', unit:'day'|'week'|'month', n } — repeats every N days/weeks/months from createdDate
  // Older saved habits have no h.repeat, only h.days — treated as weekdays mode.
  function recurrenceMatches(h, dateKey){
    const rep = h.repeat || { mode:'weekdays', days: h.days || [0,1,2,3,4,5,6] };
    if(rep.mode === 'interval'){
      const n = Math.max(1, rep.n || 1);
      const created = keyToDate(h.createdDate);
      const cur = keyToDate(dateKey);
      if(rep.unit === 'day'){
        const diff = diffDays(dateKey, h.createdDate);
        return diff >= 0 && diff % n === 0;
      }
      if(rep.unit === 'week'){
        const diff = diffDays(dateKey, h.createdDate);
        return diff >= 0 && diff % (n * 7) === 0;
      }
      if(rep.unit === 'month'){
        const monthDiff = (cur.getFullYear() - created.getFullYear()) * 12 + (cur.getMonth() - created.getMonth());
        if(monthDiff < 0 || monthDiff % n !== 0) return false;
        // land on the same day-of-month as creation, clamped to short months (e.g. the 31st -> the 28th/30th)
        const lastDayOfTargetMonth = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
        const targetDay = Math.min(created.getDate(), lastDayOfTargetMonth);
        return cur.getDate() === targetDay;
      }
      return false;
    }
    return (rep.days || h.days || []).includes(weekdayOf(dateKey));
  }
  function repeatLabel(h){
    const rep = h.repeat || { mode:'weekdays', days: h.days || [] };
    if(rep.mode === 'interval'){
      const n = rep.n || 1;
      const unitLabel = { day:'day', week:'week', month:'month' }[rep.unit] || rep.unit;
      return n === 1 ? `every ${unitLabel}` : `every ${n} ${unitLabel}s`;
    }
    const names = ['Su','Mo','Tu','We','Th','Fr','Sa'];
    const days = rep.days || h.days || [];
    if(days.length === 7) return 'every day';
    return days.slice().sort().map(d => names[d]).join(' ') || 'never';
  }
  function habitScheduledOn(h, dateKey){
    if(dateKey < h.createdDate) return false;   // habit didn't exist yet
    if(dateKey > todayKey()) return false;      // never show future occurrences
    return recurrenceMatches(h, dateKey);
  }

  // ---- Eisenhower matrix ----
  const QUADRANTS = [
    { key:'do',        label:'U / I',   fullLabel:'Urgent / Important',         color:'#5b8c3a' },
    { key:'schedule',  label:'NU / I',  fullLabel:'Not Urgent / Important',     color:'#3d7ab5' },
    { key:'delegate',  label:'U / NI',  fullLabel:'Urgent / Not Important',     color:'#b4453a' },
    { key:'eliminate', label:'NU / NI', fullLabel:'Not Urgent / Not Important', color:'#7a7a7a' },
  ];
  const CYCLE = [null, 'do', 'schedule', 'delegate', 'eliminate'];
  function quadMeta(key){ return QUADRANTS.find(q => q.key === key); }
  function nextQuadrant(cur){ return CYCLE[(CYCLE.indexOf(cur) + 1) % CYCLE.length]; }

  let contentType = 'tasks';   // 'tasks' | 'habits' | 'report' — which tab is active
  let taskViewMode = 'list';   // 'list' | 'matrix' — matrix is unified and reachable from either tab
  let listCategory = 'work';
  const contentToggle = document.getElementById('contentToggle');
  const matrixToggle = document.getElementById('matrixToggle');
  const listToggle = document.getElementById('listToggle');
  const subRow = document.getElementById('subRow');

  function syncSubRow(){
    if(contentType === 'report'){
      subRow.style.display = 'none';
      form.style.display = 'none';
      dayPicker.style.display = 'none';
      return;
    }
    subRow.style.display = 'flex';
    form.style.display = 'flex';
    dayPicker.style.display = habitCheck.checked ? 'flex' : 'none';
    // the matrix button is always reachable; the Work/Personal toggle only
    // makes sense when we're not looking at the unified matrix
    listToggle.style.display = taskViewMode === 'matrix' ? 'none' : 'flex';
  }

  contentToggle.querySelectorAll('.seg').forEach(btn => {
    btn.addEventListener('click', () => {
      contentType = btn.dataset.content;
      contentToggle.querySelectorAll('.seg').forEach(b => b.classList.toggle('active', b === btn));
      if(contentType === 'habits'){
        // leaving matrix mode when switching to Habits keeps state predictable —
        // hitting "matrix view" from either tab always starts fresh in matrix
        taskViewMode = 'list';
        matrixToggle.textContent = '▦ matrix view';
      }
      syncSubRow();
      render();
    });
  });


  matrixToggle.onclick = () => {
    taskViewMode = taskViewMode === 'list' ? 'matrix' : 'list';
    matrixToggle.textContent = taskViewMode === 'list' ? '▦ matrix view' : '☰ list view';
    if(taskViewMode === 'matrix'){
      // matrix is a unified Tasks view, so jump the Tasks/Habits toggle back to Tasks
      contentType = 'tasks';
      contentToggle.querySelectorAll('.seg').forEach(b => b.classList.toggle('active', b.dataset.content === 'tasks'));
    }
    syncSubRow();
    render();
  };
  listToggle.querySelectorAll('.seg').forEach(btn => {
    btn.addEventListener('click', () => {
      listCategory = btn.dataset.cat;
      listToggle.querySelectorAll('.seg').forEach(b => b.classList.toggle('active', b === btn));
      render();
    });
  });
  const CAT_ICON = { work:'💼', personal:'🏡' };

  // ---- data ----
  // task:  { id, text, type:'task', done, doneDate, createdDate, date, quadrant, category }
  // habit: { id, text, type:'habit', createdDate, category, days:[0-6], quadrant:'schedule', completions: {'YYYY-MM-DD':true} }
  let todos = JSON.parse(localStorage.getItem(KEY) || '[]');

  // migrate any older records saved before types/dates/ids/quadrants/repeat existed —
  // reused after import too, since a backup could come from an older version.
  function migrateTodos(list){
    let migrated = false;
    list.forEach(t => {
      if(!t.id){ t.id = newId(); migrated = true; }
      if(!t.type){ t.type = 'task'; migrated = true; }
      if(!t.category){ t.category = 'work'; migrated = true; }

      if(t.type === 'task'){
        if(!t.date || !t.createdDate){
          const k = todayKey();
          t.date = t.date || k;
          t.createdDate = t.createdDate || k;
          migrated = true;
        }
        if(t.quadrant === undefined){ t.quadrant = null; migrated = true; }
        if(t.done === undefined){ t.done = false; migrated = true; }
        if(t.dueDate === undefined){ t.dueDate = null; migrated = true; }
      } else if(t.type === 'habit'){
        if(!t.completions){ t.completions = {}; migrated = true; }
        if(!t.createdDate){ t.createdDate = todayKey(); migrated = true; }
        if(!t.repeat){
          if(!t.days || t.days.length === 0){ t.days = [0,1,2,3,4,5,6]; } // default: every day
          t.repeat = { mode:'weekdays', days: t.days };
          migrated = true;
        }
        if(!t.quadrant){ t.quadrant = 'schedule'; migrated = true; } // habits are fixed as Important/Not-Urgent
      }
    });
    return migrated;
  }
  if(migrateTodos(todos)) localStorage.setItem(KEY, JSON.stringify(todos));

  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify(todos));
    }catch(e){
      alert('Could not save — your browser storage may be full or unavailable. Use "export backup" to save your data elsewhere.');
    }
  }

  // pulls any not-done task still sitting on a past date forward onto today —
  // keeps createdDate untouched so the "carried over N days" badge (and the
  // daily report's same-day-close math, which reads off createdDate) still
  // reflect how old the task actually is
  function autoCarryOverdueTasks(){
    const today = todayKey();
    let changed = false;
    todos.forEach(t => {
      if(t.type === 'task' && !t.done && t.date < today){
        t.date = today;
        changed = true;
      }
    });
    if(changed) save();
  }
  autoCarryOverdueTasks();

  // stamps/clears doneDate alongside the done flag, so the daily report can
  // later tell same-day closes apart from tasks that lingered for a while
  function markTaskDone(t, isDone){
    t.done = isDone;
    if(isDone) t.doneDate = todayKey();
    else delete t.doneDate;
  }

  // moves the dragged task to sit immediately before/after a target task within
  // the underlying todos array, so display order (which just filters that array)
  // picks up the new position automatically
  function reorderTaskRelativeTo(draggedId, targetId, before){
    const draggedIdx = todos.findIndex(x => x.id === draggedId);
    if(draggedIdx === -1) return;
    const [dragged] = todos.splice(draggedIdx, 1);
    const targetIdx = todos.findIndex(x => x.id === targetId);
    if(targetIdx === -1){ todos.push(dragged); return; } // shouldn't happen, but don't lose the task
    todos.splice(before ? targetIdx : targetIdx + 1, 0, dragged);
  }

  // ---- delete with a brief "Undo" window instead of a blocking confirm dialog ----
  // Only the single most recent delete is undoable — deleting something else
  // while a toast is showing just replaces it, which is fine for this app's scale.
  const deleteToast = document.getElementById('deleteToast');
  const toastMsg = document.getElementById('toastMsg');
  const toastUndo = document.getElementById('toastUndo');
  let pendingDelete = null; // { task, index, timeoutId }

  function deleteWithUndo(task){
    if(pendingDelete) clearTimeout(pendingDelete.timeoutId);
    const idx = todos.findIndex(x => x.id === task.id);
    if(idx === -1) return;
    todos.splice(idx, 1);
    save(); render();
    toastMsg.textContent = (task.type === 'habit' ? 'Habit' : 'Task') + ' deleted';
    deleteToast.classList.add('show');
    const timeoutId = setTimeout(() => {
      deleteToast.classList.remove('show');
      pendingDelete = null;
    }, 5000);
    pendingDelete = { task, index: idx, timeoutId };
  }
  toastUndo.addEventListener('click', () => {
    if(!pendingDelete) return;
    clearTimeout(pendingDelete.timeoutId);
    const { task, index } = pendingDelete;
    todos.splice(Math.min(index, todos.length), 0, task);
    pendingDelete = null;
    deleteToast.classList.remove('show');
    save(); render();
  });

  // count of everything still pending today — open tasks (Work + Personal) plus
  // habits scheduled today that haven't been checked off yet. This is what the
  // minimized floating badge shows, since "how much is left today" is the most
  // useful glance-value regardless of which tab you were last on
  function todayPendingCount(){
    const today = todayKey();
    const pendingTasks = todos.filter(t => t.type === 'task' && !t.done && t.date === today).length;
    const pendingHabits = todos.filter(t => t.type === 'habit' && habitScheduledOn(t, today) && !t.completions[today]).length;
    return pendingTasks + pendingHabits;
  }

  function render(){
    boardEl.innerHTML = '';
    miniNumEl.textContent = todayPendingCount();
    if(taskViewMode === 'matrix'){
      const open = todos.filter(t => t.type === 'task' && !t.done).length;
      countEl.textContent = open + ' open';
      renderMatrix();
    } else if(contentType === 'habits'){
      const habitsList = todos.filter(t => t.type === 'habit' && t.category === listCategory);
      countEl.textContent = habitsList.length + ' habit' + (habitsList.length === 1 ? '' : 's');
      renderHabits(habitsList);
    } else if(contentType === 'report'){
      countEl.textContent = 'daily reports';
      renderReport();
    } else {
      const visible = todos.filter(t => t.type === 'task' && t.category === listCategory);
      const open = visible.filter(t => !t.done).length;
      countEl.textContent = open + ' open';
      renderListView(visible);
    }
  }

  function renderMatrix(){
    const openTodos = todos.filter(t => t.type === 'task' && !t.done);
    const unsorted = openTodos.filter(t => !t.quadrant);
    const todayKeyVal = todayKey();
    const habitTasksToday = todos.filter(t =>
      t.type === 'habit' && habitScheduledOn(t, todayKeyVal) && !t.completions[todayKeyVal]
    );

    if(unsorted.length){
      const wrap = document.createElement('div');
      wrap.className = 'unsorted';
      const h = document.createElement('div');
      h.className = 'day-head';
      h.textContent = 'Unsorted — tap a color to prioritize';
      wrap.appendChild(h);
      unsorted.forEach(t => {
        const row = document.createElement('div');
        row.className = 'unsorted-item';
        const cat = document.createElement('span');
        cat.className = 'cat-tag';
        cat.textContent = CAT_ICON[t.category] || '';
        cat.title = t.category;
        const span = document.createElement('span');
        renderLinkedText(span, t.text);
        span.style.flex = '1';
        const qa = document.createElement('div');
        qa.className = 'quick-assign';
        QUADRANTS.forEach(q => {
          const b = document.createElement('button');
          b.style.background = q.color;
          b.title = q.label;
          b.onclick = () => { t.quadrant = q.key; save(); render(); };
          qa.appendChild(b);
        });
        const editBtn = makeEditBtn(() => startInlineEdit(span, v => { t.text = v; }));
        const copyBtn = makeCopyBtn(() => t.text);
        row.append(cat, span, editBtn, copyBtn, qa);
        wrap.appendChild(row);
      });
      boardEl.appendChild(wrap);
    }

    const grid = document.createElement('div');
    grid.className = 'matrix-grid';
    QUADRANTS.forEach(q => {
      const box = document.createElement('div');
      box.className = 'quad-box';
      box.style.background = q.color;
      const h3 = document.createElement('h3');
      h3.textContent = q.fullLabel;
      box.appendChild(h3);

      const items = openTodos.filter(t => t.quadrant === q.key);
      const willHaveHabits = q.key === 'schedule' && habitTasksToday.length > 0;
      if(items.length === 0 && !willHaveHabits){
        const p = document.createElement('p');
        p.className = 'quad-empty';
        p.textContent = '—';
        box.appendChild(p);
      }
      items.forEach(t => {
        const row = document.createElement('div');
        row.className = 'quad-item';
        const cb = document.createElement('div');
        cb.className = 'box';
        cb.title = 'mark done';
        cb.onclick = () => { markTaskDone(t, true); save(); render(); };
        const cat = document.createElement('span');
        cat.className = 'cat-tag';
        cat.textContent = CAT_ICON[t.category] || '';
        cat.title = t.category;
        const span = document.createElement('span');
        renderLinkedText(span, t.text);
        span.onclick = cb.onclick;
        const undo = document.createElement('button');
        undo.textContent = '↺';
        undo.title = 'send back to unsorted';
        undo.onclick = () => { t.quadrant = null; save(); render(); };
        const editBtn = makeEditBtn(() => startInlineEdit(span, v => { t.text = v; }));
        const copyBtn = makeCopyBtn(() => t.text);
        row.append(cb, cat, span, editBtn, copyBtn, undo);
        box.appendChild(row);
      });
      grid.appendChild(box);
      if(q.key === 'schedule' && habitTasksToday.length){
        habitTasksToday.forEach(h => {
          const row = document.createElement('div');
          row.className = 'quad-item habit-row';
          const cb = document.createElement('div');
          cb.className = 'box';
          cb.title = 'mark done for today';
          cb.onclick = () => { h.completions[todayKeyVal] = true; save(); render(); };
          const cat = document.createElement('span');
          cat.className = 'cat-tag';
          cat.textContent = CAT_ICON[h.category] || '';
          cat.title = h.category;
          const span = document.createElement('span');
          renderLinkedText(span, '🔁 ' + h.text);
          span.onclick = cb.onclick;
          row.append(cb, cat, span);
          box.appendChild(row);
        });
      }
    });
    boardEl.appendChild(grid);
  }

  function renderListView(list){
    const today = todayKey();
    const dateSet = new Set(list.map(t => t.date));
    dateSet.add(today); // always keep a Today section as a drop target, even if empty
    // Today always leads, then upcoming (future) dates soonest-first, then any
    // past dates (only completed items linger here, since open ones auto-carry
    // to today) most-recent-first at the bottom.
    const future = [...dateSet].filter(d => d > today).sort();
    const past = [...dateSet].filter(d => d < today).sort((a,b) => a < b ? 1 : -1);
    const dates = [today, ...future, ...past];

    dates.forEach(dateKey => {
      const day = document.createElement('div');
      day.className = 'day';

      const label = niceLabel(dateKey);
      const head = document.createElement('div');
      head.className = 'day-head' + (label.isToday ? ' today' : '');
      head.textContent = label.text;
      day.appendChild(head);

      const ul = document.createElement('ul');
      ul.className = 'day-list';
      ul.dataset.date = dateKey;

      ul.addEventListener('dragover', e => { e.preventDefault(); ul.classList.add('drag-over'); });
      ul.addEventListener('dragleave', () => ul.classList.remove('drag-over'));
      ul.addEventListener('drop', e => {
        e.preventDefault();
        ul.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain');
        const t = todos.find(x => x.id === id);
        if(t && t.date !== dateKey){
          t.date = dateKey;
          save(); render();
        }
      });

      const items = list.filter(t => t.date === dateKey);
      items.forEach(t => {
        const li = document.createElement('li');
        li.className = t.done ? 'done' : '';
        li.draggable = true;
        li.addEventListener('dragstart', e => {
          e.dataTransfer.setData('text/plain', t.id);
          li.classList.add('dragging');
        });
        li.addEventListener('dragend', () => {
          li.classList.remove('dragging');
          // in case a dragleave was missed (e.g. drag cancelled), clear any stray indicators
          document.querySelectorAll('.drag-over-top, .drag-over-bottom').forEach(el =>
            el.classList.remove('drag-over-top', 'drag-over-bottom'));
        });
        // reordering within (or into) this day: hovering the top half of a card
        // queues an insert-before, the bottom half queues an insert-after
        li.addEventListener('dragover', e => {
          e.preventDefault();
          e.stopPropagation(); // don't also trigger the day-level (whole-list) drop target
          const rect = li.getBoundingClientRect();
          const before = (e.clientY - rect.top) < rect.height / 2;
          li.classList.toggle('drag-over-top', before);
          li.classList.toggle('drag-over-bottom', !before);
        });
        li.addEventListener('dragleave', () => {
          li.classList.remove('drag-over-top', 'drag-over-bottom');
        });
        li.addEventListener('drop', e => {
          e.preventDefault();
          e.stopPropagation();
          li.classList.remove('drag-over-top', 'drag-over-bottom');
          const draggedId = e.dataTransfer.getData('text/plain');
          if(!draggedId || draggedId === t.id) return;
          const dragged = todos.find(x => x.id === draggedId);
          if(!dragged) return;
          const rect = li.getBoundingClientRect();
          const before = (e.clientY - rect.top) < rect.height / 2;
          dragged.date = dateKey; // also handles dropping a card from a different day directly onto this one
          reorderTaskRelativeTo(draggedId, t.id, before);
          save(); render();
        });

        const box = document.createElement('div');
        box.className = 'box';
        box.onclick = () => { markTaskDone(t, !t.done); save(); render(); };

        const span = document.createElement('span');
        renderLinkedText(span, t.text);
        span.onclick = box.onclick;

        li.append(box, span);

        const editTextBtn = makeEditBtn(() => startInlineEdit(span, v => { t.text = v; }));
        const copyBtn = makeCopyBtn(() => t.text);

        const qBtn = document.createElement('button');
        qBtn.type = 'button';
        qBtn.className = 'quad-tag' + (t.quadrant ? ' set' : '');
        if(t.quadrant){
          const m = quadMeta(t.quadrant);
          qBtn.style.background = m.color;
          qBtn.textContent = m.label;
        } else {
          qBtn.textContent = '+ priority';
        }
        qBtn.title = 'click to cycle Eisenhower priority';
        qBtn.onclick = () => { t.quadrant = nextQuadrant(t.quadrant); save(); render(); };
        li.appendChild(qBtn);

        const carried = diffDays(dateKey, t.createdDate);
        if(carried > 0){

          badge.textContent = carried;
          li.appendChild(badge);
        }

        // due date: click the ⏰ icon to set/change/clear a deadline, separate from
        // the 📅 icon below (which just moves which day this card sits under). A
        // colored label appears once one is set (clay = due today/tomorrow, dark
        // red = overdue), and checkDueReminders() surfaces these in a popup too.
        const dueBtn = document.createElement('button');
        dueBtn.className = 'edit-date';
        dueBtn.type = 'button';
        dueBtn.textContent = '⏰';

        const dueLabel = document.createElement('span');
        dueLabel.className = 'due-tag';

        dueInput.className = 'date-input';
        dueInput.value = t.dueDate || '';

            const untilDue = diffDays(t.dueDate, todayKey());
            dueLabel.classList.remove('soon', 'overdue');
            if(untilDue < 0) dueLabel.classList.add('overdue');
            else if(untilDue <= 1) dueLabel.classList.add('soon');
            const pretty = keyToDate(t.dueDate).toLocaleDateString(undefined, { month:'short', day:'numeric' });
            dueLabel.textContent = (untilDue < 0 ? 'overdue ' : 'due ') + pretty;
            dueLabel.style.display = 'inline-block';
            dueBtn.title = 'change or clear the due date';
          } else {
            dueLabel.style.display = 'none';
            dueBtn.title = 'set a due date (reminds you starting 24h before)';
          }
        }
        paintDue();

        dueBtn.onclick = () => {
          dueInput.style.display = 'inline-block';
          dueBtn.style.display = 'none';
          dueLabel.style.display = 'none';
          if(dueInput.showPicker){ try{ dueInput.showPicker(); }catch(e){} }
          dueInput.focus();
        };
        function commitDue(){
          t.dueDate = dueInput.value || null;
          dueInput.style.display = 'none';
          dueBtn.style.display = 'inline-block';
          paintDue();
          save(); render();
        }
        dueInput.addEventListener('change', commitDue);
        dueInput.addEventListener('blur', () => {
          if(dueInput.value === (t.dueDate || '')){
            dueInput.style.display = 'none';
            dueBtn.style.display = 'inline-block';
            if(t.dueDate) dueLabel.style.display = 'inline-block';
          }
        });
        li.append(dueBtn, dueLabel, dueInput);

        // manual date editor: click the calendar icon to correct which day
        // this task actually belongs to (also resets its carry-over origin)
        const editBtn = document.createElement('button');
        editBtn.className = 'edit-date';
        editBtn.type = 'button';
        editBtn.title = 'set the date for this item';
        editBtn.textContent = '📅';

        const dateInput = document.createElement('input');
        dateInput.type = 'date';
        dateInput.className = 'date-input';
        dateInput.value = t.date;
        dateInput.style.display = 'none';

        editBtn.onclick = () => {
          dateInput.style.display = 'inline-block';
          editBtn.style.display = 'none';
          if(dateInput.showPicker){ try{ dateInput.showPicker(); }catch(e){} }
          dateInput.focus();
        };
        function commit(){
          if(dateInput.value){
            t.date = dateInput.value;
            t.createdDate = dateInput.value; // correcting the date resets the carry origin too
            save(); render();
          } else {
            dateInput.style.display = 'none';
            editBtn.style.display = 'inline-block';
          }
        }
        dateInput.addEventListener('change', commit);
        dateInput.addEventListener('blur', () => {
          // if nothing changed, just collapse back to the icon
          if(dateInput.value === t.date){
            dateInput.style.display = 'none';
            editBtn.style.display = 'inline-block';
          }
        });

        li.append(editBtn, dateInput);

        if(dateKey !== today){
          const moveBtn = document.createElement('button');
          moveBtn.className = 'move-btn';
          moveBtn.type = 'button';
          moveBtn.textContent = '↑ today';
          moveBtn.title = 'move to today (drag-and-drop alternative)';
          moveBtn.onclick = () => { t.date = today; save(); render(); };
          li.appendChild(moveBtn);
        }

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '×';
        del.onclick = () => deleteWithUndo(t);
        li.append(editTextBtn, copyBtn, del);

        ul.appendChild(li);
      });

      const habitItems = todos.filter(t => t.type === 'habit' && t.category === listCategory && habitScheduledOn(t, dateKey));
      habitItems.forEach(h => {
        const li = document.createElement('li');
        li.className = 'habit-row' + (h.completions[dateKey] ? ' done' : '');

        const box = document.createElement('div');
        box.className = 'box';
        box.onclick = () => {
          if(h.completions[dateKey]) delete h.completions[dateKey]; else h.completions[dateKey] = true;
          save(); render();
        };

        const span = document.createElement('span');
        renderLinkedText(span, '🔁 ' + h.text);
        span.onclick = box.onclick;

        const fixedTag = document.createElement('span');
        fixedTag.className = 'fixed-tag';
        const m = quadMeta(h.quadrant) || quadMeta('schedule');
        fixedTag.style.background = m.color;
        fixedTag.textContent = m.label;
        fixedTag.title = 'habits are fixed as Important / Not Urgent';

        li.append(box, span, fixedTag);
        ul.appendChild(li);
      });

      if(items.length === 0 && habitItems.length === 0){
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = label.isToday ? 'Nothing yet — add a line, or drag one down from above.' : 'Nothing here.';
        day.appendChild(empty);
      }

      day.appendChild(ul);
      boardEl.appendChild(day);
    });
  }


  function missStreak(habit, realToday){
    let count = 0;
    let cursor = keyToDate(realToday);
    while(true){
      const k = toKey(cursor);
      if(k < habit.createdDate) break;               // habit didn't exist yet
      const scheduled = recurrenceMatches(habit, k);
      if(scheduled){
        if(habit.completions[k]) break; // found a completed scheduled day, streak ends here
        count++;
      }
      cursor.setDate(cursor.getDate() - 1);
    }
    return count;
  }

  let editingDaysFor = null; // id of the habit currently showing its day-picker editor

  // ---- daily efficiency reports ----
  // Generated once per calendar day (at rollover, or on next open) and cached
  // by date so past days stay stable even as new tasks/habits get added later.
  const REPORTS_KEY = 'ledger-reports-v1';
  const REPORT_SCHEMA_VERSION = 2;
  let dailyReports = JSON.parse(localStorage.getItem(REPORTS_KEY) || '{}');
  function saveReports(){
    try{ localStorage.setItem(REPORTS_KEY, JSON.stringify(dailyReports)); }catch(e){ /* surfaced via save() calls elsewhere */ }
  }

  const GOALS_KEY = 'ledger-goals-v1';
  let goals = JSON.parse(localStorage.getItem(GOALS_KEY) || '{}'); // { taskGoal, habitGoalPct }
  function saveGoals(){
    try{ localStorage.setItem(GOALS_KEY, JSON.stringify(goals)); }catch(e){ /* surfaced via save() calls elsewhere */ }
  }

  function firstDataDate(){
    const dates = todos.map(t => t.createdDate).filter(Boolean);
    return dates.length ? dates.reduce((min, d) => d < min ? d : min) : todayKey();
  }

  function computeDailyReport(dateKey){
    const createdToday = todos.filter(t => t.type === 'task' && t.createdDate === dateKey);
    const closedToday = todos.filter(t => t.type === 'task' && t.done && t.doneDate === dateKey);
    const sameDayClosed = closedToday.filter(t => t.createdDate === dateKey).length;

    let oldest = null;
    const ages = [];
    const quadrantBreakdown = {};
    const categoryBreakdown = { work: 0, personal: 0 };
    closedToday.forEach(t => {
      const age = diffDays(dateKey, t.createdDate);
      ages.push(age);
      if(!oldest || age > oldest.age) oldest = { text: t.text, age };
      const qk = t.quadrant || 'none';
      quadrantBreakdown[qk] = (quadrantBreakdown[qk] || 0) + 1;
      if(t.category === 'work' || t.category === 'personal') categoryBreakdown[t.category]++;
    });
    const avgAge = ages.length ? ages.reduce((a, b) => a + b, 0) / ages.length : null;
    const sortedAges = [...ages].sort((a, b) => a - b);
    const medianAge = sortedAges.length
      ? (sortedAges.length % 2 === 1
          ? sortedAges[(sortedAges.length - 1) / 2]
          : (sortedAges[sortedAges.length / 2 - 1] + sortedAges[sortedAges.length / 2]) / 2)
      : null;

    const habitsScheduled = todos.filter(t => t.type === 'habit' && habitScheduledOn(t, dateKey));
    const habitsCompleted = habitsScheduled.filter(t => levelOf(t, dateKey) > 0).length;

    return {
      schemaVersion: REPORT_SCHEMA_VERSION,
      date: dateKey,
      tasksCreated: createdToday.length,
      tasksClosed: closedToday.length,
      sameDayClosed,
      oldest,
      ages,
      avgAge,
      medianAge,
      netBacklog: createdToday.length - closedToday.length,
      quadrantBreakdown,
      categoryBreakdown,
      habitsScheduled: habitsScheduled.length,
      habitsCompleted
    };
  }

  // Lazily computes + caches a past day's report; upgrades any pre-existing
  // cache entry that predates the current schema so older saves gain the new
  // fields (turnaround, breakdowns, etc.) without losing their "finalized" feel —
  // recomputation is deterministic off the same stored task/habit data.
  function getReport(dateKey){
    const cached = dailyReports[dateKey];
    if(cached && cached.schemaVersion === REPORT_SCHEMA_VERSION) return cached;
    const fresh = computeDailyReport(dateKey);
    dailyReports[dateKey] = fresh;
    saveReports();
    return fresh;
  }

  // Reports for daysAgoStart..daysAgoEnd (0 = today), most-recent-first,
  // stopping once we reach a date before any data exists.
  function getReportsRange(daysAgoStart, daysAgoEnd){
    const start = firstDataDate();
    const today = todayKey();
    const results = [];
    for(let i = daysAgoStart; i <= daysAgoEnd; i++){
      const cursor = new Date();
      cursor.setDate(cursor.getDate() - i);
      const k = toKey(cursor);
      if(k < start) continue;
      results.push(k === today ? computeDailyReport(k) : getReport(k));
    }
    return results;
  }

  function rollupReports(reports){
    const acc = { tasksCreated: 0, tasksClosed: 0, sameDayClosed: 0, habitsScheduled: 0, habitsCompleted: 0, ages: [] };
    reports.forEach(r => {
      acc.tasksCreated += r.tasksCreated;
      acc.tasksClosed += r.tasksClosed;
      acc.sameDayClosed += r.sameDayClosed;
      acc.habitsScheduled += r.habitsScheduled;
      acc.habitsCompleted += r.habitsCompleted;
      if(r.ages) acc.ages.push(...r.ages);
    });
    return acc;
  }

  function longestCurrentHabitStreak(){
    const start = firstDataDate();
    let streak = 0;
    let cursor = new Date();
    for(let i = 0; i < 400; i++){
      const k = toKey(cursor);
      if(k < start) break;
      const r = k === todayKey() ? computeDailyReport(k) : getReport(k);
      if(r.habitsScheduled > 0){
        if(r.habitsCompleted === r.habitsScheduled) streak++;
        else break;
      }
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  function habitsTaskCorrelation(){
    const range = getReportsRange(1, 30); // past 30 days, excluding today (still in progress)
    const full = range.filter(r => r.habitsScheduled > 0 && r.habitsCompleted === r.habitsScheduled);
    const partial = range.filter(r => r.habitsScheduled > 0 && r.habitsCompleted < r.habitsScheduled);
    if(full.length < 3 || partial.length < 3) return null; // not enough of a sample either way
    const avg = arr => arr.reduce((s, r) => s + r.tasksClosed, 0) / arr.length;
    const fullAvg = avg(full), partialAvg = avg(partial);
    if(partialAvg <= 0) return null;
    return { fullAvg, partialAvg, diffPct: Math.round(((fullAvg - partialAvg) / partialAvg) * 100) };
  }

  function bestWeekday(){
    const range = getReportsRange(1, 90);
    if(range.length < 7) return null;
    const sums = [0,0,0,0,0,0,0], counts = [0,0,0,0,0,0,0];
    range.forEach(r => { const wd = weekdayOf(r.date); sums[wd] += r.tasksClosed; counts[wd]++; });
    let bestIdx = -1, bestAvg = -1;
    for(let i = 0; i < 7; i++){
      if(counts[i] > 0){
        const avg = sums[i] / counts[i];
        if(avg > bestAvg){ bestAvg = avg; bestIdx = i; }
      }
    }
    if(bestIdx < 0) return null;
    const names = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    return { day: names[bestIdx], avg: bestAvg };
  }

  function oldestOpenTask(){
    const today = todayKey();
    let oldest = null;
    todos.forEach(t => {
      if(t.type === 'task' && !t.done){
        const age = diffDays(today, t.createdDate);
        if(!oldest || age > oldest.age) oldest = { text: t.text, age };
      }
    });
    return oldest;
  }

  function fallbackCopy(text, cb){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      cb(ok);
    }catch(e){ cb(false); }
  }

  // jumps to the Tasks list view and scrolls the given day's group into view
  // (best-effort: the group only exists if the currently-selected Work/Personal
  // category has an item on that date)
  function jumpToDate(dateKey){
    contentType = 'tasks';
    taskViewMode = 'list';
    contentToggle.querySelectorAll('.seg').forEach(b => b.classList.toggle('active', b.dataset.content === 'tasks'));
    matrixToggle.textContent = '▦ matrix view';
    syncSubRow();
    render();
    requestAnimationFrame(() => {
      const el = boardEl.querySelector(`ul.day-list[data-date="${dateKey}"]`);
      if(el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  function progressBar(value, max, overOk){
    const track = document.createElement('div');
    track.className = 'progress-track';
    const fill = document.createElement('div');
    const pct = max > 0 ? Math.min(100, Math.round((value / max) * 100)) : 0;
    fill.className = 'progress-fill' + (overOk && value >= max ? '' : '');
    fill.style.width = pct + '%';
    track.appendChild(fill);
    return track;
  }

  function renderReport(){
    const wrap = document.createElement('div');

    // --- toolbar: daily goals + copy summary ---
    const toolbar = document.createElement('div');
    toolbar.className = 'report-toolbar';
    const goalRow = document.createElement('div');
    goalRow.className = 'report-goal-row';
    const goalLabel = document.createElement('label');
    goalLabel.innerHTML = '🎯 Daily goal — close ';
    const taskGoalInput = document.createElement('input');
    taskGoalInput.type = 'number'; taskGoalInput.min = '0'; taskGoalInput.className = 'goal-input';
    taskGoalInput.placeholder = '–'; taskGoalInput.value = goals.taskGoal ?? '';
    goalLabel.appendChild(taskGoalInput);
    goalLabel.appendChild(document.createTextNode(' tasks, finish '));
    const habitGoalInput = document.createElement('input');
    habitGoalInput.type = 'number'; habitGoalInput.min = '0'; habitGoalInput.max = '100'; habitGoalInput.className = 'goal-input';
    habitGoalInput.placeholder = '–'; habitGoalInput.value = goals.habitGoalPct ?? '';
    goalLabel.appendChild(habitGoalInput);
    goalLabel.appendChild(document.createTextNode('% of habits'));
    goalRow.appendChild(goalLabel);
    toolbar.appendChild(goalRow);
    taskGoalInput.addEventListener('change', () => {
      goals.taskGoal = taskGoalInput.value === '' ? null : Number(taskGoalInput.value);
      saveGoals(); render();
    });
    habitGoalInput.addEventListener('change', () => {
      goals.habitGoalPct = habitGoalInput.value === '' ? null : Number(habitGoalInput.value);
      saveGoals(); render();
    });

    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'ghost report-copy-btn';
    copyBtn.textContent = '📋 copy weekly summary';
    toolbar.appendChild(copyBtn);
    wrap.appendChild(toolbar);

    // --- live "today" card ---
    const todayReport = computeDailyReport(todayKey());
    wrap.appendChild(reportCard(todayReport, true));

    // --- oldest currently-open task nudge ---
    const oldestOpen = oldestOpenTask();
    if(oldestOpen && oldestOpen.age >= 3){
      const nudge = document.createElement('div');
      nudge.className = 'report-note warn';
      nudge.innerHTML = `⏳ Oldest <u>open</u> task right now: <b>${oldestOpen.age}d</b> old — "${escapeHtml(oldestOpen.text)}"`;
      wrap.appendChild(nudge);
    }

    // --- this week / week-over-week ---
    const thisWeek = getReportsRange(0, 6);
    const lastWeek = getReportsRange(7, 13);
    const thisWeekRollup = rollupReports(thisWeek);
    wrap.appendChild(rollupCard('This week', thisWeekRollup));

    if(lastWeek.length >= 5){
      const lastWeekRollup = rollupReports(lastWeek);
      let text = '';
      if(lastWeekRollup.tasksClosed > 0){
        const pct = Math.round(((thisWeekRollup.tasksClosed - lastWeekRollup.tasksClosed) / lastWeekRollup.tasksClosed) * 100);
        const dir = pct >= 0 ? 'more' : 'fewer';
        text = `${Math.abs(pct)}% ${dir} tasks closed than last week (${thisWeekRollup.tasksClosed} vs ${lastWeekRollup.tasksClosed}).`;
      } else if(thisWeekRollup.tasksClosed > 0){
        text = `Closed ${thisWeekRollup.tasksClosed} tasks this week — no closes last week to compare against.`;
      }
      if(text){
        const wow = document.createElement('div');
        wow.className = 'report-note';
        wow.textContent = text;
        wrap.appendChild(wow);
      }
    }

    // --- this month rollup ---
    const thisMonth = getReportsRange(0, 29);
    if(thisMonth.length >= 7){
      wrap.appendChild(rollupCard('This month', rollupReports(thisMonth)));
    }

    // --- 14-day trend chart ---
    const trendReports = getReportsRange(0, 13).reverse(); // oldest -> newest, left to right
    if(trendReports.length >= 3){
      wrap.appendChild(trendChart(trendReports));
    }

    // --- habit streak + habits/tasks correlation + best weekday ---
    const streak = longestCurrentHabitStreak();
    if(streak > 0){
      const s = document.createElement('div');
      s.className = 'report-note good';
      s.textContent = `🔥 ${streak}-day streak of hitting every scheduled habit.`;
      wrap.appendChild(s);
    }
    const corr = habitsTaskCorrelation();
    if(corr){
      const c = document.createElement('div');
      c.className = 'report-note';
      const dir = corr.diffPct >= 0 ? 'more' : 'fewer';
      c.textContent = `On days you finish all your habits, you close ${Math.abs(corr.diffPct)}% ${dir} tasks on average (${corr.fullAvg.toFixed(1)} vs ${corr.partialAvg.toFixed(1)}).`;
      wrap.appendChild(c);
    }
    const best = bestWeekday();
    if(best){
      const b = document.createElement('div');
      b.className = 'report-note';
      b.textContent = `📅 Your most productive day tends to be ${best.day} (avg ${best.avg.toFixed(1)} tasks closed).`;
      wrap.appendChild(b);
    }

    // --- history list ---
    const pastReports = getReportsRange(1, 14);
    if(pastReports.length){
      const head = document.createElement('div');
      head.className = 'report-history-head';
      head.textContent = 'Past days';
      wrap.appendChild(head);
      pastReports.forEach(r => wrap.appendChild(reportCard(r, false)));
    }

    boardEl.appendChild(wrap);

    copyBtn.onclick = () => {
      const habitPct = thisWeekRollup.habitsScheduled > 0
        ? Math.round((thisWeekRollup.habitsCompleted / thisWeekRollup.habitsScheduled) * 100) : 0;
      const lines = [
        `Weekly summary (${todayKey()})`,
        `Tasks closed: ${thisWeekRollup.tasksClosed} (of ${thisWeekRollup.tasksCreated} created)`,
        `Closed same-day: ${thisWeekRollup.sameDayClosed}`,
        `Habits followed: ${habitPct}%`,
      ];
      if(streak > 0) lines.push(`Current full-habit streak: ${streak} day(s)`);
      if(best) lines.push(`Most productive day: ${best.day}`);
      const text = lines.join('\n');
      const showFeedback = (ok) => {
        const original = copyBtn.textContent;
        copyBtn.textContent = ok ? '✓ copied' : '✗ copy failed';
        setTimeout(() => { copyBtn.textContent = original; }, 1500);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(() => showFeedback(true)).catch(() => fallbackCopy(text, showFeedback));
      } else {
        fallbackCopy(text, showFeedback);
      }
    };
  }

  function rollupCard(title, roll){
    const card = document.createElement('div');
    card.className = 'report-card rollup';
    const head = document.createElement('div');
    head.className = 'report-date';
    head.innerHTML = `<span>${title}</span>`;
    card.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'report-grid';
    const habitPct = roll.habitsScheduled > 0 ? Math.round((roll.habitsCompleted / roll.habitsScheduled) * 100) : null;
    const avgAge = roll.ages.length ? (roll.ages.reduce((a, b) => a + b, 0) / roll.ages.length).toFixed(1) : '–';
    const metrics = [
      [roll.tasksClosed, `tasks closed (of ${roll.tasksCreated} created)`],
      [roll.sameDayClosed, 'closed same-day as created'],
      [habitPct !== null ? habitPct + '%' : '–', 'habits followed'],
      [avgAge, 'avg turnaround (days)'],
    ];
    metrics.forEach(([num, lbl]) => {
      const m = document.createElement('div');
      m.className = 'report-metric';
      const n = document.createElement('span'); n.className = 'num'; n.textContent = num;
      const l = document.createElement('span'); l.className = 'lbl'; l.textContent = lbl;
      m.append(n, l);
      grid.appendChild(m);
    });
    card.appendChild(grid);
    return card;
  }

  function trendChart(reports){
    const card = document.createElement('div');
    card.className = 'report-card';
    const head = document.createElement('div');
    head.className = 'report-date';
    head.innerHTML = '<span>Last 14 days — tasks closed</span>';
    card.appendChild(head);

    const maxVal = Math.max(1, ...reports.map(r => r.tasksClosed));
    const w = 300, h = 80, barW = w / reports.length;
    let bars = '';
    reports.forEach((r, i) => {
      const totalH = (r.tasksClosed / maxVal) * (h - 14);
      const sameH = (r.sameDayClosed / maxVal) * (h - 14);
      const x = i * barW + 2;
      const bw = Math.max(1, barW - 4);
      const yTotal = h - 14 - totalH;
      const ySame = h - 14 - sameH;
      bars += `<rect x="${x}" y="${yTotal}" width="${bw}" height="${totalH}" fill="#c7d9ba"></rect>`;
      bars += `<rect x="${x}" y="${ySame}" width="${bw}" height="${sameH}" fill="#5c6b4f"></rect>`;
      const day = keyToDate(r.date).getDate();
      bars += `<text x="${x + bw / 2}" y="${h - 2}" font-size="7" text-anchor="middle" fill="#8a8175">${day}</text>`;
    });
    const svgWrap = document.createElement('div');
    svgWrap.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
    card.appendChild(svgWrap);

    const legend = document.createElement('div');
    legend.className = 'report-chart-legend';
    legend.innerHTML = `<span><i style="background:#5c6b4f"></i>same-day</span><span><i style="background:#c7d9ba"></i>closed later</span>`;
    card.appendChild(legend);

    return card;
  }

  function reportCard(r, isLive){
    const card = document.createElement('div');
    card.className = 'report-card' + (isLive ? ' today' : '');

    const dateRow = document.createElement('div');
    dateRow.className = 'report-date' + (isLive ? '' : ' clickable');
    const label = document.createElement('span');
    label.textContent = r.date === todayKey() ? `Today · ${r.date}` : r.date;
    dateRow.appendChild(label);

  // Builds a GitHub-style contribution heatmap for one habit: weekday rows
  // (Mon..Sun) down the side, one column per week, spanning Jan 1 – Dec 31
  // of `year`. Returns the wrapper element plus done/tracked day counts.
  function buildYearHeat(t, year, realToday){
    const jan1 = new Date(year, 0, 1);
    const dec31 = new Date(year, 11, 31);
    const firstDow = (jan1.getDay() + 6) % 7; // Mon=0 .. Sun=6
    const lastDow = (dec31.getDay() + 6) % 7;
    const gridStart = new Date(year, 0, 1 - firstDow);
    const numWeeks = Math.round(((dec31.getTime() - gridStart.getTime()) / 86400000 + (6 - lastDow) + 1) / 7);

    const wrap = document.createElement('div');
    wrap.className = 'habit-heat';

    const dow = document.createElement('div');
    dow.className = 'habit-heat-dow';
    ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(lbl => {
      const s = document.createElement('span');
      s.textContent = lbl;
      dow.appendChild(s);
    });
    wrap.appendChild(dow);

    const scroll = document.createElement('div');
    scroll.className = 'habit-heat-scroll';

    const monthRow = document.createElement('div');
    monthRow.className = 'habit-heat-months';
    monthRow.style.gridTemplateColumns = `repeat(${numWeeks}, 12px)`;

    const grid = document.createElement('div');
    grid.className = 'habit-heat-grid';
    grid.style.gridTemplateColumns = `repeat(${numWeeks}, 12px)`;

    let doneCount = 0, trackedDays = 0;

    for(let w = 0; w < numWeeks; w++){
      let monthStartsHere = null;
      for(let d = 0; d < 7; d++){
        const cellDate = new Date(gridStart);
        cellDate.setDate(gridStart.getDate() + w * 7 + d);
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'hcell';
        cell.style.gridColumn = String(w + 1);
        cell.style.gridRow = String(d + 1);

        if(cellDate.getFullYear() !== year){
          cell.classList.add('pad');
          cell.disabled = true;
        } else {
          if(cellDate.getDate() === 1) monthStartsHere = cellDate.getMonth();
          const k = toKey(cellDate);
          const isFuture = k > realToday;
          const beforeStart = k < t.createdDate;
          const isScheduled = recurrenceMatches(t, k);
          const lvl = levelOf(t, k);

          if(lvl > 0){
            cell.classList.add('l' + lvl);
            cell.title = `${k} — level ${lvl}/4 (click to change)`;
            doneCount++;
          }
          else if(isFuture || beforeStart || !isScheduled){
            cell.classList.add(isFuture ? 'future' : 'before');
            cell.title = k;
          }
          else {
            cell.classList.add('missed');
            cell.title = `${k} — not done (click to log)`;
          }

          if(k === realToday) cell.classList.add('today');

          if(!isFuture && !beforeStart && isScheduled){
            trackedDays++;
            cell.onclick = () => {
              const next = lvl >= 4 ? 0 : lvl + 1;
              if(next === 0) delete t.completions[k]; else t.completions[k] = next;
              save(); render();
            };
          } else {
            cell.disabled = true;
          }
        }
        grid.appendChild(cell);
      }
      if(monthStartsHere !== null){
        const lbl = document.createElement('span');
        lbl.textContent = new Date(year, monthStartsHere, 1).toLocaleDateString(undefined, { month:'short' });
        lbl.style.gridColumnStart = String(w + 1);
        monthRow.appendChild(lbl);
      }
    }

    scroll.append(monthRow, grid);
    wrap.appendChild(scroll);
    return { el: wrap, doneCount, trackedDays };
  }

  // Everything lives in localStorage tied to one browser+origin, so this is

  const exportBtn = document.getElementById('exportBtn');

  function buildBackup(){

  importBtn.addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', () => {

  // ---- date/time awareness: notice midnight rolling over even if the tab

  let lastKnownDay = todayKey();
  function checkDayRollover(){
    const now = todayKey();
    if(now !== lastKnownDay){
      // the day that just ended is now finalized — lock in its report
      getReport(lastKnownDay);

  // ---- due-date reminders: starts flagging an item 24h before its due date

  const dueModal = document.getElementById('dueModal');

  function checkDueReminders(){
    const today = todayKey();
    const due = todos.filter(t => t.type === 'task' && !t.done && t.dueDate && diffDays(t.dueDate, today) <= 1);
    if(due.length === 0) return;

    due.sort((a, b) => a.dueDate < b.dueDate ? -1 : 1);
    dueModalList.innerHTML = '';
    due.forEach(t => {
      const untilDue = diffDays(t.dueDate, today);
      const pretty = keyToDate(t.dueDate).toLocaleDateString(undefined, { month:'long', day:'numeric' });
      let when;
      if(untilDue < 0) when = `overdue — was due ${pretty}`;
      else if(untilDue === 0) when = `due today (${pretty})`;
      else when = `due tomorrow (${pretty})`;
      const li = document.createElement('li');

      const b = document.createElement('b');
      b.textContent = t.text; // set via textContent, not innerHTML, so task text can't inject markup
      li.append(b, ` — ${when}`);
      dueModalList.appendChild(li);
    });
    dueModal.style.display = 'flex';

  // ---- Document Picture-in-Picture: the "floats over other tabs" part ----
  const supported = 'documentPictureInPicture' in window;
  pipSupport.textContent = supported ? '' : '(needs Chrome/Edge)';

  let currentPipWindow = null;
  const FULL_SIZE = { w: 300, h: 380 };
  const MINI_SIZE = { w: 88, h: 88 };
  let lastFullSize = { ...FULL_SIZE }; // remembers the size you last manually resized the popped-out window to

  function setMini(isMini){
    if(!currentPipWindow) return;
    if(isMini){
      // capture whatever size the window is currently at (including manual
      // drag-resizes) before shrinking, so un-minimizing can restore it
      const w = currentPipWindow.innerWidth, h = currentPipWindow.innerHeight;
      if(w && h) lastFullSize = { w, h };
    }
    currentPipWindow.document.body.classList.toggle('mini', isMini);
    const size = isMini ? MINI_SIZE : lastFullSize;
    try{ currentPipWindow.resizeTo(size.w, size.h); }catch(e){}
  }

    const pipWindow = await window.documentPictureInPicture.requestWindow({
      width: FULL_SIZE.w,

    });

    pipWindow.document.body.classList.add('pip-mode');
    pipWindow.document.body.appendChild(sheet);

    function reattach(){
      if(sheet.isConnected && sheet.ownerDocument === document){
        // already back in the main tab, nothing to do
        return;
      }
      document.body.classList.remove('pip-mode', 'mini');
      document.body.appendChild(sheet);
      render(); // rebuild list in case anything was mid-edit
    }

    // Primary signal: the PiP window firing pagehide when it closes.
    pipWindow.addEventListener('pagehide', () => {
      reattach();
      currentPipWindow = null;
    }, { once: true });

    // Fallback: pagehide isn't 100% reliable across Chrome versions for
    // Document Picture-in-Picture, so also poll pipWindow.closed directly.
    const watcher = setInterval(() => {
      if(pipWindow.closed){
        clearInterval(watcher);
        reattach();
        currentPipWindow = null;
      }
    }, 300);
  });
})();
</script>
</body>
</html>
